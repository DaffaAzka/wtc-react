services:
  wtc-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_AUTH_URL: ${VITE_AUTH_URL}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI}

    pull_policy: build

    ports:
      - "${FRONTEND_PORT}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

    restart: unless-stopped
